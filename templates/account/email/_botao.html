{# Botão que funciona nos aplicativos de e-mail (tabela com link), com o endereço por extenso embaixo #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 0"><tr>
  <td style="background:#5fd6a0;border-radius:999px">
    <a href="{{ url }}" style="display:inline-block;padding:13px 26px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#10291f;text-decoration:none;border-radius:999px">{{ rotulo }}</a>
  </td></tr></table>
<p style="margin:18px 0 0;font-size:13px;line-height:1.5;color:#4f5b6a">Se o botão não abrir, copie este endereço no navegador:<br>
  <a href="{{ url }}" style="color:#17795a;word-break:break-all">{{ url }}</a></p>

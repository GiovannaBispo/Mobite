{% load mobite %}{# Zoom por botões, por cima do mapa: quem não consegue fazer o movimento de pinça também aproxima e afasta. #}
<div class="zoom-sobre" role="group" aria-label="Zoom do mapa">
  <button type="button" data-zoom="in" aria-label="Aproximar o mapa" title="Aproximar">{% icone "plus" %}</button>
  <button type="button" data-zoom="out" aria-label="Afastar o mapa" title="Afastar">{% icone "minus" %}</button>
</div>
